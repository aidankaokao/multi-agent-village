# 設定值都在 .env（由 .env.example 複製），部署請用 ./build.sh
services:
  backend:
    image: ${IMAGE_REGISTRY:-}${BACKEND_IMAGE:-village-backend}:${IMAGE_TAG:?請在 .env 設定 IMAGE_TAG}
    build:
      context: ./backend
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        UV_VERSION: ${UV_VERSION:-0.6.14}
    environment:
      TZ: ${TZ:-Asia/Taipei}
      VILLAGE_OLLAMA_URL: ${VILLAGE_OLLAMA_URL:-http://host.docker.internal:11434/v1}
      VILLAGE_MASTER_KEY: ${VILLAGE_MASTER_KEY:-}     # 留空 = 自動產生並存到 village-secrets volume
    volumes:
      - ./agents:/app/agents:ro   # 內建範例村民，只在第一次啟動時匯入 DB；之後在介面「村民」分頁管理
      - village-data:/data        # SQLite DB
      - village-secrets:/config   # 主金鑰（與 DB 分開，備份 DB 不會帶走金鑰）
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux 也能連主機上的 Ollama
    restart: unless-stopped
    # 不開 port 到主機：只透過 frontend 的 nginx 存取

  frontend:
    image: ${IMAGE_REGISTRY:-}${FRONTEND_IMAGE:-village-frontend}:${IMAGE_TAG:?請在 .env 設定 IMAGE_TAG}
    build:
      context: ./frontend
      args:
        NODE_VERSION: ${NODE_VERSION:-20}
        NGINX_VERSION: ${NGINX_VERSION:-1.27}
    ports:
      - "${FRONTEND_PORT:?請在 .env 填入 FRONTEND_PORT}:80"
    environment:
      TZ: ${TZ:-Asia/Taipei}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  village-data:
  village-secrets:
