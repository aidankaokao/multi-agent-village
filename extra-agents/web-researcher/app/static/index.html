<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>網路研究員 · 測試</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --line:#ddd6c8; --text:#2b2a27; --muted:#7a7468; --accent:#1d3557; --ok:#2f7a4a; --bad:#b03a2e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.7 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  .muted { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin: 12px 0; }
  details > summary { cursor: pointer; font-weight: 600; }
  label { display:block; margin: 8px 0 2px; font-size: 13px; color: var(--muted); }
  input, select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fffdf9; }
  textarea { resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 160px; }
  button { padding: 7px 14px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; font: inherit; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .status { font-size: 13px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .answer { white-space: pre-wrap; }
  .cite { color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: none; }
  .source { border-left: 3px solid var(--line); padding: 4px 10px; margin: 8px 0; font-size: 14px; }
  .source.hl { border-color: var(--accent); background: #fbf3ef; }
  .source .text { white-space: pre-wrap; display: none; margin-top: 4px; }
  .source.open .text { display: block; }
  .q { font-weight: 600; margin-bottom: 6px; }
  .outside { margin-top: 10px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); background: #faf8f3; }
  .check { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .check input { width: auto; }
  .answer { white-space: pre-wrap; }
  .progress { font-size: 13px; color: var(--muted); }
  .progress div::before { content: "… "; }
  .cite { color: var(--accent); font-weight: 600; text-decoration: none; }
  .source { border-left: 3px solid var(--line); padding: 4px 10px; margin: 6px 0; font-size: 14px; word-break: break-all; }
  .q { font-weight: 600; margin-bottom: 6px; }
</style>
</head>
<body>
<main>
  <h1>網路研究員 · 測試</h1>
  <div class="muted">這個網頁模擬「另一個應用程式呼叫 agent API」：用 A2A 的 message/stream 送出問題，token 與 LLM 設定放在 HTTP header。</div>
  <div id="health" class="status muted">檢查服務狀態中…</div>

  <div class="card">
    <details id="settings-box">
      <summary>⚙️ 連線設定 <span id="settings-state" class="muted"></span></summary>
      <div id="unlock" hidden>
        <label>記住設定的方式改了：最後一次輸入以前設的密碼解開，之後打開網頁會自動帶入，不用再輸入密碼</label>
        <div class="row"><input id="unlock-pw" type="password" autocomplete="current-password"><button id="unlock-btn" type="button">解開</button>
          <button id="forget-btn" type="button" class="ghost">不要了，重新填</button></div>
        <div id="unlock-msg" class="status bad"></div>
      </div>
      <label>存取 token（agent 的 .env 裡 WR_ACCESS_TOKENS 的其中一個）</label>
      <input id="token" type="password" autocomplete="off">
      <div class="row">
        <div><label>LLM 網址（OpenAI 相容）</label><input id="llm-url" placeholder="https://openrouter.ai/api/v1"></div>
        <div><label>模型</label><input id="llm-model" placeholder="例如 openai/gpt-5-mini、deepseek/deepseek-v4-flash"></div>
      </div>
      <div class="row">
        <div><label>LLM API key（本機 Ollama 可以留空）</label><input id="llm-key" type="password" autocomplete="off"></div>
        <div><label>思考強度（選填）</label>
          <select id="llm-effort"><option value="">預設</option><option>none</option><option>low</option><option>medium</option><option>high</option></select></div>
      </div>
      <div class="row" style="margin-top:6px">
        <button type="button" class="ghost" data-preset="openrouter">填入 OpenRouter</button>
        <button type="button" class="ghost" data-preset="ollama">填入本機 Ollama</button>
      </div>
      <div class="check"><input id="remember" type="checkbox"><label for="remember" style="margin:0">記住設定（加密存在這個瀏覽器，下次打開自動帶入）</label></div>
      <div class="row" style="margin-top:10px"><button id="save-btn" type="button">套用</button>
        <button id="forget-saved" type="button" class="ghost" hidden>刪除記住的設定</button></div>
      <div id="save-msg" class="status"></div>
      <div class="muted" style="margin-top:6px">不勾「記住」時，設定只存在這個分頁的記憶體裡，重新整理就要重填。
        勾選時用這個瀏覽器專屬、無法匯出的金鑰加密（WebCrypto AES-GCM，金鑰存在瀏覽器的 IndexedDB）後才存：電腦上的檔案是密文，
        但能用這個瀏覽器打開這個網頁的人都能直接使用這些設定（和瀏覽器記住密碼一樣），公用電腦不要勾。</div>
    </details>
  </div>

  <div class="card">
    <form id="ask-form">
      <textarea id="question" rows="3" placeholder="問一個需要上網查的問題，例如：2026 年台灣電價有調整嗎？（Enter 送出、Shift+Enter 換行）"></textarea>
      <div class="row" style="margin-top:8px">
        <button id="ask-btn" type="submit">研究</button>
        <button id="search-btn" type="button" class="ghost" title="只看搜尋結果，不讀網頁、不呼叫 LLM（不花錢）">只看搜尋結果</button>
      </div>
    </form>
  </div>

  <div id="results"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const STORE_KEY = "wr-settings-v1";
let settings = { token: "", url: "", model: "", key: "", effort: "" };

// ---------------------------------------------------------------- 記住設定（WebCrypto）
// v2：瀏覽器自己產生、無法匯出的 AES-GCM 金鑰（存在 IndexedDB），打開網頁自動解密，不用輸入密碼。
// v1（舊版）：使用者自訂密碼（PBKDF2）加密；只用來把舊資料解開一次、轉成 v2。
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
function storedBox() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch { return null; } }
function keyStore(mode, fn) {
  return new Promise((ok, fail) => {
    const open = indexedDB.open("agent-test-page", 1);
    open.onupgradeneeded = () => open.result.createObjectStore("keys");
    open.onerror = () => fail(open.error);
    open.onsuccess = () => {
      const req = fn(open.result.transaction("keys", mode).objectStore("keys"));
      req.onsuccess = () => ok(req.result); req.onerror = () => fail(req.error);
    };
  });
}
async function deviceKey(create) {
  let key = await keyStore("readonly", (s) => s.get(STORE_KEY));
  if (!key && create) {
    key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]); // false = 不能匯出
    await keyStore("readwrite", (s) => s.put(key, STORE_KEY));
  }
  return key;
}
async function remember(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await deviceKey(true), enc.encode(JSON.stringify(obj)));
  localStorage.setItem(STORE_KEY, JSON.stringify({ v: 2, iv: b64(iv), ct: b64(ct) }));
}
async function recall(box) {
  const key = await deviceKey(false);
  if (!key) throw new Error("找不到金鑰");
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct))));
}
async function unsealV1(box, password) {
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(box.salt), iterations: 310000, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct))));
}
async function forget() {
  localStorage.removeItem(STORE_KEY);
  try { await keyStore("readwrite", (s) => s.delete(STORE_KEY)); } catch {}
}

// ---------------------------------------------------------------- 設定
function fillForm() {
  $("token").value = settings.token; $("llm-url").value = settings.url; $("llm-model").value = settings.model;
  $("llm-key").value = settings.key; $("llm-effort").value = settings.effort;
}
function readForm() {
  return { token: $("token").value.trim(), url: $("llm-url").value.trim(), model: $("llm-model").value.trim(),
           key: $("llm-key").value.trim(), effort: $("llm-effort").value };
}
function showState() {
  const box = storedBox();
  if (!settings.token && box?.v === 1) { $("settings-state").textContent = "（🔒 舊版記住的設定，輸入密碼解開一次）"; return; }
  const parts = [settings.token ? "token ✓" : "還沒填 token", settings.url && settings.model ? `LLM：${settings.model}` : "沒有 LLM（只列出找到的資料）"];
  if (box?.v === 2) parts.push("已記住");
  $("settings-state").textContent = "（" + parts.join("、") + "）";
  $("forget-saved").hidden = !box;
}
document.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.preset === "openrouter") { $("llm-url").value = "https://openrouter.ai/api/v1"; }
  else { $("llm-url").value = "http://host.docker.internal:11434/v1"; $("llm-key").value = ""; $("llm-model").value ||= "qwen3.5:9b"; $("llm-effort").value = "none"; }
}));
$("save-btn").addEventListener("click", async () => {
  settings = readForm();
  $("save-msg").className = "status ok";
  if ($("remember").checked) {
    if (!window.isSecureContext) { $("save-msg").className = "status bad"; $("save-msg").textContent = "瀏覽器的加密功能只能在 localhost 或 https 使用；請用 http://localhost:… 打開這個網頁"; return; }
    await remember(settings);
    $("save-msg").textContent = "已套用，並加密記住在這個瀏覽器（下次打開自動帶入）。";
  } else {
    await forget();
    $("save-msg").textContent = "已套用（只在這個分頁，重新整理要重填）。";
  }
  $("unlock").hidden = true;
  showState();
});
$("forget-saved").addEventListener("click", async () => {
  if (!confirm("刪除這個瀏覽器記住的設定？（目前分頁裡的設定還能用，重新整理後就要重填）")) return;
  await forget(); $("remember").checked = false; showState();
  $("save-msg").className = "status ok"; $("save-msg").textContent = "已刪除記住的設定。";
});
// 舊版（密碼加密）的設定：解開一次並轉成新版，之後不用再輸入密碼
$("unlock-btn").addEventListener("click", async () => {
  try {
    settings = await unsealV1(storedBox(), $("unlock-pw").value);
  } catch { $("unlock-msg").textContent = "密碼不對"; $("unlock-pw").select(); return; }
  await remember(settings);
  fillForm(); $("unlock").hidden = true; $("unlock-pw").value = ""; $("remember").checked = true; showState();
  $("save-msg").className = "status ok"; $("save-msg").textContent = "已解開並改成新的記住方式，之後打開會自動帶入。";
  $("settings-box").open = false;
  const next = pending; pending = null;
  if (next && settings.token) next(); // 剛剛被擋下來的動作：解開後直接接著做
});
$("unlock-pw").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); $("unlock-btn").click(); } });
$("forget-btn").addEventListener("click", async () => {
  await forget(); $("unlock").hidden = true; $("remember").checked = false; showState(); $("token").focus();
});

// 還沒有可用的設定：舊版記住的設定 → 請使用者輸入密碼（解開後自動接著做）；沒有 → 請使用者填設定
let pending = null;
function needSettings(action) {
  $("settings-box").open = true;
  if (storedBox()?.v === 1) {
    pending = action;
    $("unlock-msg").textContent = "輸入以前設的密碼按「解開」（或 Enter），解開後會自動繼續；之後就不用再輸入。";
    $("unlock-pw").focus();
  } else {
    $("save-msg").className = "status bad"; $("save-msg").textContent = "先填存取 token 並按「套用」";
    $("token").focus();
  }
}

// 打開網頁：自動帶入記住的設定
async function loadSaved() {
  const box = storedBox();
  if (box?.v === 2) {
    try {
      settings = await recall(box);
      fillForm(); $("remember").checked = true;
    } catch {
      await forget(); // 金鑰不見了（例如清除過網站資料）：只能重填
      $("save-msg").className = "status bad"; $("save-msg").textContent = "記住的設定讀不出來（可能清除過瀏覽器資料），請重新填一次。";
    }
  } else if (box?.v === 1) {
    $("unlock").hidden = false;
  }
  if (!settings.token) { $("settings-box").open = true; (box?.v === 1 ? $("unlock-pw") : $("token")).focus(); }
  showState();
}

// ---------------------------------------------------------------- 呼叫 agent
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function headers() {
  const h = { "Content-Type": "application/json", Authorization: `Bearer ${settings.token}` };
  if (settings.url && settings.model) {
    h["X-LLM-Base-URL"] = settings.url; h["X-LLM-Model"] = settings.model;
    if (settings.key) h["X-LLM-API-Key"] = settings.key;
    if (settings.effort) h["X-LLM-Reasoning-Effort"] = settings.effort;
  }
  return h;
}
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^\s*[*-]\s+/gm, "• ").replace(/^#{1,6}\s+(.+)$/gm, "<b>$1</b>")
  .replace(/\[(\d{1,2})\]/g, '<a href="#src-$1" class="cite">[$1]</a>');

function card(q) {
  const box = document.createElement("div");
  box.className = "card";
  box.innerHTML = `<div class="q">❓ ${esc(q)}</div><div class="progress"></div><div class="answer"></div><div class="meta"></div>`;
  $("results").prepend(box);
  return box;
}

async function ask() {
  const q = $("question").value.trim();
  if (!q) return;
  if (!settings.token) { needSettings(ask); return; }
  const box = card(q);
  const progress = (t) => { const d = document.createElement("div"); d.textContent = t; box.querySelector(".progress").append(d); };
  const out = box.querySelector(".answer"), meta = box.querySelector(".meta");
  $("ask-btn").disabled = true;
  const started = Date.now();
  try {
    const body = { jsonrpc: "2.0", id: 1, method: "message/stream",
                   params: { message: { kind: "message", role: "user", messageId: crypto.randomUUID(), parts: [{ kind: "text", text: q }] } } };
    const r = await fetch("/a2a", { method: "POST", headers: headers(), body: JSON.stringify(body) });
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.detail || `HTTP ${r.status}`); }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "", text = "", data = null;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith("data:")) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.error) throw new Error(ev.error.message);
        const res = ev.result;
        if (res.kind === "status-update" && !res.final) progress(res.status.message?.parts?.[0]?.text || "處理中");
        if (res.kind === "artifact-update") {
          const p = res.artifact.parts[0];
          if (p.kind === "text") { text = res.append ? text + p.text : p.text; out.innerHTML = md(text); }
          if (p.kind === "data") data = p.data;
        }
      }
    }
    const cites = data?.citations || [];
    meta.innerHTML = `<div class="muted" style="margin-top:6px">${[data?.model && `模型：${esc(data.model)}`, `共 ${((Date.now() - started) / 1000).toFixed(1)} 秒`,
        data?.queries?.length && `關鍵字：${data.queries.map(esc).join("／")}`].filter(Boolean).join("・")}</div>
      ${(data?.notes || []).map((n) => `<div class="status bad">※ ${esc(n)}</div>`).join("")}
      ${data?.llm_error ? `<div class="status bad">LLM：${esc(data.llm_error)}</div>` : ""}
      ${cites.length ? `<details open style="margin-top:8px"><summary>資料來源（${cites.length}）</summary>${cites.map((c) => `<div class="source" id="src-${c.n}"><b>[${c.n}]</b>
        <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a> <span class="muted">${esc(c.section || "")}</span></div>`).join("")}</details>` : ""}
      ${data?.failed?.length ? `<details><summary class="muted">讀不到的網頁（${data.failed.length}）</summary>${data.failed.map((f) => `<div class="source muted">${esc(f.url)}：${esc(f.error)}</div>`).join("")}</details>` : ""}`;
  } catch (e) {
    const broken = e instanceof TypeError || /input stream|network|fetch|load failed/i.test(e.message);
    out.innerHTML = `<div class="status bad">${esc(e.message)}${broken ? "（和 agent 的連線中途斷了：請在 web-researcher 資料夾執行 docker-compose logs --tail 50 查看）" : ""}</div>`;
  } finally { $("ask-btn").disabled = false; }
}

async function searchOnly() {
  const q = $("question").value.trim();
  if (!q) return;
  if (!settings.token) { needSettings(searchOnly); return; }
  const box = card(q);
  try {
    const r = await fetch(`/search?q=${encodeURIComponent(q)}`, { headers: headers() });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
    box.querySelector(".answer").innerHTML = d.hits.map((h, i) => `<div class="source"><b>[${i + 1}]</b> <a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title)}</a>
      <span class="muted">${esc(h.site)}${h.published ? "・" + esc(h.published) : ""}</span><div class="muted">${esc(h.snippet)}</div></div>`).join("") || "沒有結果";
  } catch (e) { box.querySelector(".answer").innerHTML = `<div class="status bad">${esc(e.message)}</div>`; }
}
$("ask-form").addEventListener("submit", (e) => { e.preventDefault(); ask(); });
$("search-btn").addEventListener("click", searchOnly);
$("question").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } });

// ---------------------------------------------------------------- 啟動
async function health() {
  try {
    const h = await (await fetch("/health")).json();
    let t = h.ok ? "✅ 服務正常（搜尋引擎連得上）" : `⚠️ 搜尋引擎（SearXNG）連不上：${h.search_error}`;
    if (!h.auth_configured) t += "・⚠️ agent 還沒設定存取 token（.env 的 WR_ACCESS_TOKENS）";
    $("health").className = "status " + (h.ok ? "ok" : "bad");
    $("health").textContent = t;
  } catch { $("health").className = "status bad"; $("health").textContent = "連不上服務"; }
}
health();
loadSaved();
</script>
</body>
</html>
