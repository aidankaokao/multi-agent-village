[project]
name = "web-researcher-agent"
version = "0.1.0"
description = "網路研究員：搜尋網路（自架 SearXNG）、讀網頁、附引用來源回答的獨立 agent（可外接到 Multi-Agent Village）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "trafilatura>=2.0",
]

[project.scripts]
wr = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
