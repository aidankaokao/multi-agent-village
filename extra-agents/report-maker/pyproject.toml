[project]
name = "report-maker-agent"
version = "0.1.0"
description = "文件彙整師：把 Excel / CSV / txt / PDF 整理成彙整報告 PDF 的獨立 agent（可外接到 Multi-Agent Village）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "weasyprint>=62",
    "jinja2>=3.1",
    # pdfminer（讀 PDF）會載入 cryptography；47+ 的 aarch64 wheel 在本機 Docker VM 會 SIGILL（exit 132），同村子的釘法
    "cryptography>=43,<47",
]

[project.scripts]
rmk = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
