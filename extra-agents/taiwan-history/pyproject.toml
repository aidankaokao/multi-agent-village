[project]
name = "taiwan-history-agent"
version = "0.1.0"
description = "台灣史專家：以公開資料做 RAG 的獨立 agent（可外接到 Multi-Agent Village）"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
