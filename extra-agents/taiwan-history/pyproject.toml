[project]
name = "taiwan-history-agent"
version = "0.1.0"
description = "台灣史專家：以公開資料做 RAG 的獨立 agent（可外接到 Multi-Agent Village）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
th = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
