# 報社：獨立部署（和 Multi-Agent Village 分開）
#   cp .env.example .env → ./build.sh → docker-compose up -d → 打開 http://localhost:${NP_PORT}
services:
  newspaper:
    image: ${IMAGE_REGISTRY:-}${IMAGE_NAME:-newspaper-agent}:${IMAGE_TAG:-0.1.0}
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        UV_VERSION: ${UV_VERSION:-0.6.14}
    restart: unless-stopped
    ports:
      # 預設只開給本機：呼叫時 header 裡有 LLM 的 API key，跨機器要走 HTTPS 才安全
      - "${NP_BIND:-127.0.0.1}:${NP_PORT:-8103}:8103"
    environment:
      TZ: ${TZ:-Asia/Taipei}
      NP_ACCESS_TOKENS: ${NP_ACCESS_TOKENS:-}
      NP_PUBLIC_URL: ${NP_PUBLIC_URL:-http://localhost:8103}
      NP_ALLOWED_LLM_HOSTS: ${NP_ALLOWED_LLM_HOSTS:-}
      NP_MASTHEAD: ${NP_MASTHEAD:-村莊日報}
      NP_MAX_FILES: ${NP_MAX_FILES:-6}
      NP_MAX_FILE_MB: ${NP_MAX_FILE_MB:-2}
      NP_MAX_TOTAL_MB: ${NP_MAX_TOTAL_MB:-6}
      NP_DOC_CHARS: ${NP_DOC_CHARS:-6000}
      NP_MAX_CONCURRENT: ${NP_MAX_CONCURRENT:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux 也能連主機上的 Ollama
    # 資料只在記憶體處理；根目錄唯讀，/tmp 用記憶體
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${NP_MEM_LIMIT:-1g}
