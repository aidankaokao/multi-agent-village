[project]
name = "newspaper-agent"
version = "0.1.0"
description = "報社：把採訪資料（網路研究員查好的新聞）編成 A4 報紙 PDF 的獨立 agent（可外接到 Multi-Agent Village）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "weasyprint>=62",
    "jinja2>=3.1",
    "pypdfium2>=4.30",
    "pillow>=10.4",
]

[project.scripts]
np = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["real_render: 真的用 WeasyPrint 排版（需要 Pango）"]
